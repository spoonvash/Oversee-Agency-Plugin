name: Deploy Customer Dashboard
on:
  push:
    branches:
      - Master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy oversee-customer-dashboard plugin
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./oversee-customer-dashboard/oversee-customer-dashboard/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:public_html/wp-content/plugins/oversee-customer-dashboard/

      - name: Cleanup
        run: rm -f ~/.ssh/deploy_key
