name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-beta"* ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi

      - name: Update version in plugin file
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CLEAN_VERSION=${VERSION%-beta}
          sed -i "s/Version: .*/Version: $CLEAN_VERSION/" oversee-helpdesk/oversee-helpdesk/oversee-helpdesk.php
          sed -i "s/define('FLAVOR_STARTER_VERSION', '.*')/define('FLAVOR_STARTER_VERSION', '$CLEAN_VERSION')/" oversee-helpdesk/oversee-helpdesk/oversee-helpdesk.php

      - name: Create plugin zip
        run: |
          cd oversee-helpdesk
          zip -r ../oversee-helpdesk.zip oversee-helpdesk/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: oversee-helpdesk.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to OverseeAgency.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /public_html/wp-content/uploads/plugins/
          include: oversee-helpdesk.zip

      - name: Update version manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CHANNEL=${{ steps.version.outputs.channel }}
          CLEAN_VERSION=${VERSION%-beta}
          
          # Create manifest file
          cat > version.json << MANIFEST
          {
            "stable": "${{ steps.version.outputs.channel == 'stable' && steps.version.outputs.version || 'KEEP_CURRENT' }}",
            "beta": "$CLEAN_VERSION",
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          MANIFEST

      - name: Upload manifest
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /public_html/wp-content/uploads/plugins/
          include: version.json
