name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: |
          # Full version including -beta suffix
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a prerelease
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi

          echo "📦 Version: $VERSION"
          echo "📢 Channel: $(if [[ "$VERSION" == *"-beta"* ]]; then echo 'beta'; else echo 'stable'; fi)"

      - name: Update version in plugin file
        run: |
          PLUGIN_FILE="oversee-helpdesk/oversee-helpdesk/oversee-helpdesk.php"
          VERSION="${{ steps.version.outputs.version }}"

          # Update all three version locations
          sed -i "s/Version: .*/Version: $VERSION/" "$PLUGIN_FILE"
          sed -i "s/define('OVERSEE_VERSION', '.*')/define('OVERSEE_VERSION', '$VERSION')/" "$PLUGIN_FILE"
          sed -i "s/new Oversee_Helpdesk_Updater(__FILE__, '.*')/new Oversee_Helpdesk_Updater(__FILE__, '$VERSION')/" "$PLUGIN_FILE"

          echo "✅ Updated plugin to version $VERSION"
          echo ""
          echo "=== Version verification ==="
          grep -E "^\s*\*\s*Version:|define\('OVERSEE_VERSION'|new Oversee_Helpdesk_Updater" "$PLUGIN_FILE"

      - name: Verify version consistency
        run: |
          PLUGIN_FILE="oversee-helpdesk/oversee-helpdesk/oversee-helpdesk.php"
          VERSION="${{ steps.version.outputs.version }}"

          # Extract versions from file
          HEADER_VERSION=$(grep -oP "^\s*\*\s*Version:\s*\K[0-9a-z.-]+" "$PLUGIN_FILE" || echo "NOT_FOUND")
          CONST_VERSION=$(grep -oP "define\('OVERSEE_VERSION',\s*'\K[0-9a-z.-]+" "$PLUGIN_FILE" || echo "NOT_FOUND")
          UPDATER_VERSION=$(grep -oP "new Oversee_Helpdesk_Updater\(__FILE__,\s*'\K[0-9a-z.-]+" "$PLUGIN_FILE" || echo "NOT_FOUND")

          echo "Expected: $VERSION"
          echo "Header:   $HEADER_VERSION"
          echo "Constant: $CONST_VERSION"
          echo "Updater:  $UPDATER_VERSION"

          # Verify all match
          if [[ "$HEADER_VERSION" != "$VERSION" ]] || [[ "$CONST_VERSION" != "$VERSION" ]] || [[ "$UPDATER_VERSION" != "$VERSION" ]]; then
            echo "❌ ERROR: Version mismatch detected!"
            exit 1
          fi

          echo "✅ All versions match!"

      - name: Commit version back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oversee-helpdesk/oversee-helpdesk/oversee-helpdesk.php
          git diff --staged --quiet || git commit -m "Bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:Master || echo "Nothing to push or push failed (non-fatal)"

      - name: Create plugin zip
        run: |
          # Create clean directory structure
          mkdir -p /tmp/oversee-helpdesk
          cp -r oversee-helpdesk/oversee-helpdesk/* /tmp/oversee-helpdesk/

          # Verify version in zip contents
          echo "=== Version in zip ==="
          grep -E "^\s*\*\s*Version:" /tmp/oversee-helpdesk/oversee-helpdesk.php

          # Create zip
          cd /tmp
          zip -r oversee-helpdesk.zip oversee-helpdesk/
          mv oversee-helpdesk.zip $GITHUB_WORKSPACE/

          echo "✅ Created oversee-helpdesk.zip"

      - name: Create license server zip
        run: |
          cd oversee-license-server
          zip -r ../oversee-license-server.zip . -x "*.zip"
          echo "✅ Created oversee-license-server.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            oversee-helpdesk.zip
            oversee-license-server.zip
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            ## Oversee Helpdesk ${{ steps.version.outputs.version }}

            **Channel:** ${{ steps.version.outputs.channel }}

            ### Installation
            1. Download `oversee-helpdesk.zip`
            2. In WordPress, go to Plugins → Add New → Upload Plugin
            3. Upload the zip file and activate

            ### Changes
            See commit history for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Channel | ${{ steps.version.outputs.channel }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prerelease | ${{ steps.version.outputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The update server will pick up this release within 5 minutes." >> $GITHUB_STEP_SUMMARY
